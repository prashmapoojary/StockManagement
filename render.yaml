services:
  # Backend API
  - type: web
    name: warehouse-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: warehouse-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: CLIENT_URL
        fromService:
          type: static
          name: warehouse-web
          property: url
      - key: NODE_ENV
        value: production

  # Frontend Web
  - type: static
    name: warehouse-web
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: warehouse-api
          property: url
      - key: VITE_SOCKET_URL
        fromService:
          type: web
          name: warehouse-api
          property: url

databases:
  - name: warehouse-db
    plan: free
    region: singapore
